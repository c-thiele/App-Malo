<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convocazione U.S. MALO 1908</title>
<style>
:root{--ink:#0f172a;--soft:#64748b;--line:#e2e8f0;--panel:#f8fafc;--dk:#0b0f17;--dk2:#151c28;--go:#f59e0b;--go2:#fcd34d;--ok:#10b981;--red:#ef4444;--f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
.app{max-width:860px;margin:0 auto;padding:10px 10px calc(18px + env(safe-area-inset-bottom,0px))}
.wrap{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 14px 34px -14px rgba(15,23,42,.3)}
input,textarea,button{font-family:inherit}

/* testata */
.hero{background:radial-gradient(ellipse at 50% 0,rgba(245,158,11,.16),transparent 70%),linear-gradient(180deg,var(--dk),var(--dk2));color:#fff;padding:16px 16px 14px;border-bottom:4px solid var(--go)}
.hero input{background:transparent;border:0;outline:0;color:#fff;width:100%;min-width:0}
.hero input::placeholder{color:rgba(255,255,255,.35)}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ttl{text-align:right;font-weight:900;letter-spacing:.06em;font-size:clamp(15px,4.6vw,22px);text-transform:uppercase}
.cust{color:var(--go2)!important;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:clamp(14px,3.8vw,20px)}
.sub{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 12px}
.sub input{text-align:center;text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:12px;border-bottom:1px solid rgba(255,255,255,.25)}
.sub .comp{flex:1 1 auto;max-width:420px}.sub .day{flex:0 0 96px}.sub i{color:var(--go);font-style:normal}
.banner{text-align:center;font-weight:800;font-size:12px;letter-spacing:.24em;color:var(--go2);padding:5px 12px;border:1px solid rgba(245,158,11,.3);border-radius:30px;background:rgba(245,158,11,.08);margin-bottom:14px}
.teams{display:flex;align-items:center;justify-content:center;gap:12px}
.tm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.tm input{text-align:center;text-transform:uppercase;font-weight:800;font-size:16px;letter-spacing:.03em;border-bottom:1.5px solid rgba(255,255,255,.25)}
.teams.away .own{order:3}.teams.away .vsb{order:2}.teams.away .opp{order:1}
.vsb{display:flex;flex-direction:column;align-items:center;gap:6px}
.vs{background:linear-gradient(135deg,#f59e0b,#b45309);color:var(--dk);font-weight:900;padding:5px 11px;border-radius:8px;letter-spacing:.1em}
.swap{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:3px 10px;font-size:13px;cursor:pointer}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(245,158,11,.35)}
.mf{background:rgba(255,255,255,.06);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:5px 8px;text-align:center;min-width:0}
.mf label{display:block;font-size:10.5px;font-weight:900;color:var(--go2);text-transform:uppercase;letter-spacing:.1em}
.mf input{text-align:center;font-weight:800;font-size:15px;padding:2px 0}
.mf input::-webkit-calendar-picker-indicator{filter:invert(.9)}

/* loghi */
.slot{position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:64px;cursor:pointer;border-radius:50%;border:1.5px dashed rgba(245,158,11,.5);flex-shrink:0}
.slot.sm{width:48px;height:48px;border-radius:12px}
.slot.has{border-style:solid;border-color:rgba(255,255,255,.12)}
.slot img{max-width:88%;max-height:88%;object-fit:contain;display:none}
.slot.has img{display:block}.slot.has .pl{display:none}
.slot .pl{color:var(--go);font-weight:700;font-size:20px}
.slot input[type=file]{display:none}
.lx{display:none;position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#ef4444;color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0}
.slot.has.rm .lx{display:block}
.slot.ft{border-radius:10px;width:auto;min-width:120px;height:52px;border-color:var(--line);padding:0 14px}
.slot.ft .pl{color:var(--soft);font-size:12px;font-weight:700}
.slot.ft img{max-height:44px;max-width:220px}

/* corpo */
.content{padding:14px 14px 4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.45;resize:vertical;outline:0;background:#fff;color:var(--ink)}
.rhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.rhead b{font-size:14px}.rhead span{font-size:12px;color:var(--soft);font-weight:700}
.rcols,.r{display:grid;grid-template-columns:38px 34px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.5fr) 30px;align-items:center;column-gap:6px}
.rcols{background:var(--dk2);color:#fff;border-radius:8px 8px 0 0;border-bottom:2px solid var(--go);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:7px 4px}
.r{padding:3px 4px;border-bottom:1px solid var(--line);min-height:40px}
.r:nth-child(even){background:#fff}
.r.off .nm,.r.off .rl{opacity:.4}
.r input[type=text]{width:100%;min-width:0;border:1px solid transparent;border-radius:6px;background:transparent;padding:6px 6px;font-size:14px;color:var(--ink);outline:0}
.r input[type=text]:focus{border-color:var(--line);background:#fff}
.r .nm{font-weight:700}
.r .n{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.r .c{display:flex;justify-content:center;align-items:center;height:36px;cursor:pointer}
.r input[type=checkbox]{width:20px;height:20px;accent-color:var(--dk)}
.r .x{border:0;background:none;color:#94a3b8;font-size:15px;cursor:pointer;border-radius:6px;height:32px}
.add{width:100%;margin-top:10px;padding:10px;border:1.5px dashed var(--line);border-radius:8px;background:#fff;font-weight:700;font-size:13px;color:var(--dk2);cursor:pointer}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0 14px}
.foot .mt{width:100%;border-top:1px solid var(--line);padding-top:8px;text-align:center;font-size:10.5px;letter-spacing:.3em;color:var(--soft);font-weight:800;text-transform:uppercase}

/* pulsanti */
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.b{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 15px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.b.go{background:linear-gradient(135deg,#f59e0b,#d97706);border:0;color:var(--dk);font-weight:800}
.b.dk{background:var(--dk);color:#fff;border-color:var(--dk)}
.bar.main .b{flex:1 1 150px}
.status{text-align:center;font-size:12px;font-weight:700;color:var(--dk2);min-height:20px;margin-top:8px}

/* telefono */
@media (max-width:640px){
  .hero{padding:14px 12px 12px}
  .sub{flex-wrap:wrap}.sub .comp{flex:1 1 100%;max-width:none}.sub i{display:none}.sub .day{flex:1 1 100%}
  .slot{width:54px;height:54px}.tm input{font-size:15px}
  .rcols{display:none}
  .r{grid-template-columns:36px 28px minmax(0,1fr) minmax(0,1fr) 30px;grid-template-areas:"c n nm nm x" ". . rl nt nt";row-gap:0;padding:6px 4px;border-bottom:1px solid var(--line)}
  .r .c{grid-area:c}.r .n{grid-area:n}.r .nm{grid-area:nm}.r .rl{grid-area:rl}.r .nt{grid-area:nt}.r .x{grid-area:x}
  .r input[type=text]{font-size:16px}.r .rl,.r .nt{font-size:14px;color:var(--soft)}
  .r:first-of-type{border-top:1px solid var(--line)}
  .panel{padding:10px}.content{padding:10px 10px 2px}
}

/* foglio A4 per stampa e immagine */
#printRoot{position:fixed;left:-99999px;top:0}
.pg{width:720px;margin:0 auto;background:#fff;color:#0f172a;font-family:var(--f)}
.pg .ph{background:linear-gradient(180deg,#0b0f17,#151c28);color:#fff;border-radius:10px;border-bottom:4px solid #f59e0b;padding:14px 18px 12px}
.pg .pt{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;font-weight:900;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.pg .pt .ta{text-align:right}.pg .pt .tb{color:#fcd34d}
.pg .lg{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.pg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pg .ps{text-align:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:7px 0 8px}
.pg .pbn{text-align:center;font-weight:800;font-size:11.5px;letter-spacing:.24em;color:#fcd34d;padding:3px 10px;border:1px solid rgba(245,158,11,.5);border-radius:20px;background:rgba(245,158,11,.12);margin-bottom:10px}
.pg .pm{display:flex;align-items:center;justify-content:center;gap:18px}
.pg .pk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pg .pc{width:58px;height:58px;display:flex;align-items:center;justify-content:center}
.pg .pn{font-weight:800;font-size:15px;text-transform:uppercase;text-align:center;border-bottom:1px solid rgba(255,255,255,.3);padding:2px 6px;min-width:150px}
.pg .pv{background:#f59e0b;color:#0b0f17;font-weight:900;padding:3px 10px;border-radius:6px;letter-spacing:.1em}
.pg .pi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(245,158,11,.4)}
.pg .pi div{background:rgba(255,255,255,.07);border:1px solid rgba(245,158,11,.4);border-radius:8px;text-align:center;padding:4px 6px;min-height:40px}
.pg .pi small{display:block;color:#fcd34d;font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.pg .pi b{font-size:14px}
.pg .pnote{margin-top:8px;font-size:11.5px;line-height:1.4;white-space:pre-wrap;padding:6px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px}
.pg table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.pg th{background:#151c28;color:#fff;text-transform:uppercase;font-size:10px;letter-spacing:.08em;padding:5px 6px;text-align:left;border-bottom:2px solid #f59e0b}
.pg td{padding:3px 6px;height:23px;border-bottom:1px solid #cbd5e1}
.pg tr:nth-child(even) td{background:#f8fafc}
.pg td.ck{width:34px;text-align:center;color:#10b981;font-weight:900}
.pg td.nn{width:34px;text-align:center;font-weight:800}
.pg td.nm{font-weight:700;font-size:12.5px}
.pg tr.off td.nm,.pg tr.off td.rl{opacity:.35}
.pg .pf{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pg .pf .fl{height:40px;display:flex;align-items:center}
.pg .pf .mt{border-top:1px solid #e2e8f0;width:100%;text-align:center;padding-top:5px;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;color:#64748b}

@page{size:A4 portrait;margin:8mm}
@media print{
  html,body{background:#fff!important;margin:0;padding:0}
  body>*:not(#printRoot){display:none!important}
  #printRoot{position:static;left:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
 <div class="wrap">
  <header class="hero">
   <div class="top">
    <div class="ttl">U.S. MALO 1908</div>
    <label class="slot sm" data-slot="headerLogo"><img alt=""><span class="pl">+</span><input type="file" accept="image/*"><button type="button" class="lx" title="Rimuovi">✕</button></label>
    <input class="cust" data-k="headerCustomText" placeholder="Settore Giovanile">
   </div>
   <div class="sub">
    <input class="comp" data-k="competitionName" placeholder="CAMPIONATO REGIONALE ELITE UNDER 15 - GIRONE A">
    <i>·</i>
    <input class="day" data-k="matchday" placeholder="Giornata n.">
   </div>
   <div class="banner">CONVOCATI PER LA PARTITA</div>
   <div class="teams" id="teams">
    <div class="tm own">
     <label class="slot" data-slot="ownLogo"><img alt=""><span class="pl">+</span><input type="file" accept="image/*"><button type="button" class="lx" title="Rimuovi">✕</button></label>
     <input data-k="teamOwnName" placeholder="U.S. MALO 1908">
    </div>
    <div class="vsb"><div class="vs">VS</div><button type="button" class="swap" id="swap" title="Inverti casa e trasferta">⇄ casa/trasf.</button></div>
    <div class="tm opp">
     <label class="slot" data-slot="oppLogo"><img alt=""><span class="pl">+</span><input type="file" accept="image/*"><button type="button" class="lx" title="Rimuovi">✕</button></label>
     <input data-k="teamOppName" placeholder="Avversario">
    </div>
   </div>
   <div class="meta">
    <div class="mf"><label>Data</label><input type="date" data-k="matchDate"></div>
    <div class="mf"><label>Luogo</label><input type="text" data-k="matchPlace" placeholder="Luogo / Campo"></div>
    <div class="mf"><label>Ora convocazione</label><input type="time" data-k="callTime"></div>
    <div class="mf"><label>Ora inizio partita</label><input type="time" data-k="matchTime"></div>
   </div>
  </header>

  <main class="content">
   <div class="panel"><textarea data-k="generalNotes" placeholder="Note generali (ritrovo, divisa, materiale da portare...)"></textarea></div>
   <div class="panel">
    <div class="rhead"><b>Rosa</b><span id="count"></span></div>
    <div class="rcols"><span>Conv.</span><span>N°</span><span>Nome</span><span>Ruolo</span><span>Note</span><span></span></div>
    <div id="roster"></div>
    <button class="add" id="add" type="button">+ Aggiungi giocatore</button>
   </div>
   <div class="foot">
    <label class="slot ft" data-slot="footerLogo"><img alt=""><span class="pl">+ Logo piè di pagina</span><input type="file" accept="image/*"><button type="button" class="lx" title="Rimuovi">✕</button></label>
    <div class="mt">Hic manebimus optime</div>
   </div>
  </main>
 </div>

 <div class="bar main">
  <button class="b go" id="bPrint" type="button">Stampa / Salva PDF</button>
  <button class="b dk" id="bImg" type="button">Immagine da condividere</button>
 </div>
 <div class="bar">
  <button class="b" id="bSave" type="button">Salva</button>
  <button class="b" id="bSel" type="button">Seleziona tutti</button>
  <button class="b" id="bNew" type="button">Nuova convocazione</button>
  <button class="b" id="bExp" type="button">Esporta backup</button>
  <button class="b" id="bImp" type="button">Importa backup</button>
  <button class="b" id="bRes" type="button">Azzera tutto</button>
  <input type="file" id="fImp" accept=".json" hidden>
 </div>
 <div class="status" id="st"></div>
</div>
<div id="printRoot"></div>
<datalist id="ruoli"><option value="PORTIERE"><option value="DIFENSORE"><option value="CENTROCAMPISTA"><option value="ATTACCANTE"></datalist>

  if(!d||typeof d!=='object')return;
  S={...blank(),...d};
  S.players=(Array.isArray(d.players)&&d.players.length?d.players:blank().players).map(p=>({convocato:p.convocato!==false,nome:p.nome||'',ruolo:p.ruolo||'',note:p.note||''}));
}
function status(m){const e=$('#st');e.textContent=m;setTimeout(()=>{if(e.textContent===m)e.textContent=''},4000)}

/* ---- schermo ---- */
function fill(){
  TXT.forEach(k=>{const e=document.querySelector('[data-k="'+k+'"]');if(e)e.value=S[k]||''});
  LOGO.forEach(k=>{
    const s=document.querySelector('[data-slot="'+k+'"]'),src=k==='ownLogo'?(S[k]||CREST):S[k];
    s.classList.toggle('has',!!src);s.classList.toggle('rm',!!S[k]);
    if(src)s.querySelector('img').src=src;else s.querySelector('img').removeAttribute('src');
  });
  $('#teams').classList.toggle('away',!!S.away);
  roster();
}
function roster(){
  let k=0;
  $('#roster').innerHTML=S.players.map((p,i)=>`<div class="r${p.convocato?'':' off'}"><label class="c"><input type="checkbox" data-i="${i}" data-f="convocato"${p.convocato?' checked':''}></label><span class="n">${p.convocato&&p.nome.trim()?++k:''}</span><input type="text" class="nm" placeholder="Nome cognome" value="${esc(p.nome)}" data-i="${i}" data-f="nome"><input type="text" class="rl" list="ruoli" placeholder="Ruolo" value="${esc(p.ruolo)}" data-i="${i}" data-f="ruolo"><input type="text" class="nt" placeholder="Note" value="${esc(p.note)}" data-i="${i}" data-f="note"><button type="button" class="x" data-i="${i}" data-f="rm" title="Elimina riga">✕</button></div>`).join('');
  const tot=S.players.filter(p=>p.nome.trim()).length;$('#count').textContent=k+(k===1?' convocato':' convocati')+' su '+tot;
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){S[t.dataset.k]=t.value;save();return}
  if(t.dataset.f&&t.type==='text'){S.players[+t.dataset.i][t.dataset.f]=t.value;save()}
});
$('#roster').addEventListener('change',e=>{
  if(e.target.dataset.f==='convocato'){S.players[+e.target.dataset.i].convocato=e.target.checked;save();roster()}
});
$('#roster').addEventListener('click',e=>{
  if(e.target.dataset.f==='rm'){S.players.splice(+e.target.dataset.i,1);save();roster()}
});
$('#add').onclick=()=>{S.players.push(newP());save();roster()};
$('#swap').onclick=()=>{S.away=!S.away;save();$('#teams').classList.toggle('away',S.away)};

/* logo: ridimensionati per non riempire la memoria */
function shrink(file){
  return new Promise((ok,ko)=>{
    const r=new FileReader();
    r.onerror=ko;
    r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{
      const k=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/png'))};im.src=r.result};
    r.readAsDataURL(file);
  });
}
document.querySelectorAll('[data-slot]').forEach(s=>{
  const k=s.dataset.slot;
  s.querySelector('input[type=file]').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S[k]=await shrink(f);save();fill()}catch(x){status('Immagine non valida.')}e.target.value=''};
  s.querySelector('.lx').onclick=e=>{e.preventDefault();e.stopPropagation();S[k]=null;save();fill()};
});

/* ---- foglio A4 ---- */
const fname=ext=>{
  const own=S.teamOwnName.trim()||'U.S. MALO 1908',opp=S.teamOppName.trim();
  const base=opp?(S.away?opp+' - '+own:own+' - '+opp):own;
  return base.replace(/[\/\\?%*:|"<>]/g,'-')+(ext?'.'+ext:'');
};
function sheetHTML(){
  const own={n:S.teamOwnName.trim()||'U.S. MALO 1908',l:S.ownLogo||CREST},opp={n:S.teamOppName.trim()||'Avversario',l:S.oppLogo};
  const [A,B]=S.away?[opp,own]:[own,opp];
  const tm=t=>`<div class="pk"><div class="pc">${t.l?`<img src="${t.l}" alt="">`:''}</div><div class="pn">${esc(t.n)}</div></div>`;
  const d=S.matchDate?S.matchDate.split('-').reverse().join('/'):'';
  const f=(l,v)=>`<div><small>${l}</small><b>${esc(v)||'&nbsp;'}</b></div>`;
  let k=0;
  const rows=S.players.map(p=>{const on=p.convocato,has=p.nome.trim()||p.ruolo.trim()||p.note.trim();if(!has)return'';
    return`<tr class="${on?'':'off'}"><td class="ck">${on?'✔':''}</td><td class="nn">${on&&p.nome.trim()?++k:''}</td><td class="nm">${esc(p.nome)}</td><td class="rl">${esc(p.ruolo)}</td><td>${esc(p.note)}</td></tr>`}).join('');
  return`<div class="pg"><div class="ph">
   <div class="pt"><div class="ta">U.S. MALO 1908</div><div class="lg">${S.headerLogo?`<img src="${S.headerLogo}" alt="">`:''}</div><div class="tb">${esc(S.headerCustomText)}</div></div>
   <div class="ps">${esc(S.competitionName)}${S.competitionName&&S.matchday?' · ':''}${esc(S.matchday)}</div>
   <div class="pbn">CONVOCATI PER LA PARTITA</div>
   <div class="pm">${tm(A)}<div class="pv">VS</div>${tm(B)}</div>
   <div class="pi">${f('Data',d)}${f('Luogo',S.matchPlace)}${f('Ora convocazione',S.callTime)}${f('Ora inizio partita',S.matchTime)}</div>
  </div>
  ${S.generalNotes.trim()?`<div class="pnote">${esc(S.generalNotes)}</div>`:''}
  <table><thead><tr><th></th><th>N°</th><th>Nome</th><th>Ruolo</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="pf"><div class="fl">${S.footerLogo?`<img src="${S.footerLogo}" alt="">`:''}</div><div class="mt">Hic manebimus optime</div></div></div>`;
}
async function mount(fit){
  const r=$('#printRoot');r.innerHTML=sheetHTML();
  const pg=r.firstElementChild;
  await Promise.all([...r.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>0):0));
  pg.style.zoom='';
  if(fit){const h=pg.offsetHeight,max=1030;if(h>max)pg.style.zoom=(max/h).toFixed(4)}
  return pg;
}
$('#bPrint').onclick=async()=>{
  await mount(true);
  const t=document.title;document.title=fname();
  window.print();
  setTimeout(()=>{document.title=t},1500);
};
$('#bImg').onclick=async()=>{
  status('Preparo l\u2019immagine\u2026');
  try{
    const pg=await mount(false);
    const c=await html2canvas(pg,{scale:2,backgroundColor:'#FFFFFF',useCORS:true});
    const blob=await new Promise(r=>c.toBlob(r,'image/png')),f=new File([blob],fname('png'),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fname()});status('Immagine pronta \u2713');return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();status('Immagine scaricata \u2713');
  }catch(e){if(e&&e.name==='AbortError')return;console.error(e);status('Non sono riuscito a creare l\u2019immagine.')}
};

/* ---- dati ---- */
$('#bSave').onclick=()=>{save();status('Salvato \u2713 (si salva comunque da solo a ogni modifica).')};
$('#bSel').onclick=()=>{S.players.forEach(p=>p.convocato=true);save();roster()};
$('#bNew').onclick=()=>{
  S.players.forEach(p=>{p.convocato=true;p.note=''});
  ['teamOppName','matchday','matchDate','matchPlace','callTime','matchTime','generalNotes'].forEach(k=>S[k]='');
  S.oppLogo=null;S.away=false;save();fill();status('Pronto per una nuova convocazione.');
};
$('#bRes').onclick=()=>{
  if(!confirm('Vuoi azzerare tutto, compresi i dati e i loghi salvati?'))return;
  S=blank();try{localStorage.removeItem(KEY)}catch(e){}fill();status('Tutto azzerato.');
};
$('#bExp').onclick=()=>{
  save();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='backup_convocazione_'+fname()+'.json';a.click();status('Backup scaricato \u2713');
};
$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;adopt(d);save();fill();status('Dati ripristinati dal backup \u2713')}catch(x){alert('File di backup non valido: serve un file .json esportato da questo foglio.')}};
  r.readAsText(f);e.target.value='';
};

try{adopt(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){}
fill();
</script>
</body>
</html>
